<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>크라운켄 | NIKKE SPECIAL</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');

    :root {
      --bg-dark: #070913;
      --card-bg: rgba(15, 20, 35, 0.88);
      --card-border: rgba(0, 240, 255, 0.3);
      --text-main: #f0f4f8;
      --text-sub: #8a99ad;
      --cyan: #00f0ff;
      --gold: #ffbe00;
      --pink: #ff0055;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }

    body { 
      background: radial-gradient(circle at 50% 20%, #151b33 0%, var(--bg-dark) 80%), url('kraken.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main); 
      padding: 24px 16px; 
      max-width: 1350px; 
      margin: 0 auto; 
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 28px; padding: 16px 20px;
      background: rgba(10, 14, 26, 0.92);
      border: 1px solid var(--cyan);
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1);
      backdrop-filter: blur(8px);
      flex-wrap: wrap; gap: 14px;
    }

    .header-title-wrap { display: flex; align-items: center; gap: 12px; }
    .kraken-icon {
      width: 45px; height: 45px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--gold);
      box-shadow: 0 0 8px rgba(255,190,0,0.6);
      background: #000;
    }

    h1 {
      font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
      font-size: 1.6rem; font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 10px var(--cyan);
    }

    .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #saveStatus { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: var(--gold); font-weight: bold; text-shadow: 0 0 6px rgba(255,190,0,0.5); }
    
    .level-box {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--gold);
      border-radius: 6px; padding: 6px 12px;
      display: flex; align-items: center; gap: 8px;
      font-size: 0.85rem; color: var(--text-main);
      box-shadow: 0 0 8px rgba(255, 190, 0, 0.2);
    }
    .level-input {
      width: 65px; background: #000; color: var(--gold);
      border: 1px solid var(--gold); border-radius: 4px;
      padding: 4px; text-align: center; font-family: 'Orbitron', sans-serif; font-weight: bold;
    }

    .btn-action {
      font-family: 'Noto Sans KR', sans-serif;
      border: none; padding: 8px 14px; border-radius: 4px;
      font-weight: bold; cursor: pointer; transition: all 0.2s ease;
      font-size: 0.85rem;
    }
    .btn-load { background: var(--gold); color: #000; box-shadow: 0 0 10px rgba(255, 190, 0, 0.4); }
    .btn-save { background: var(--cyan); color: #000; box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
    .btn-action:hover { transform: translateY(-2px); filter: brightness(1.2); }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; margin-bottom: 28px; }
    .prob-card {
      background: var(--card-bg); backdrop-filter: blur(10px);
      padding: 18px; border-radius: 8px;
      border: 1px solid var(--card-border);
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.05);
      position: relative; transition: 0.3s;
    }
    .prob-card:hover { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
    .prob-card h3 {
      font-family: 'Orbitron', sans-serif; font-size: 1.15rem;
      margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; color: var(--cyan);
    }
    .stage-tag { font-size: 0.75rem; background: rgba(0,240,255,0.15); color: var(--cyan); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--cyan); }
    .btn-delete-stage { background: transparent; border: 1px solid var(--pink); color: var(--pink); font-size: 0.75rem; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
    .btn-delete-stage:hover { background: var(--pink); color: #fff; box-shadow: 0 0 8px var(--pink); }

    .prob-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-sub); }
    .prob-row .v { color: var(--text-main); font-weight: bold; }
    .prob-row .cyan { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }
    .expect-line { display: flex; justify-content: space-between; border-top: 1px dashed rgba(255,255,255,0.15); margin-top: 8px; padding-top: 8px; font-weight: bold; font-size: 0.9rem; }
    .expect-line .num { color: var(--gold); text-shadow: 0 0 5px rgba(255,190,0,0.5); }

    .sucker-meter { display: flex; flex-wrap: wrap; background: var(--card-bg); backdrop-filter: blur(10px); padding: 14px 18px; border-radius: 8px; margin-bottom: 28px; border: 1px solid var(--card-border); }
    .sucker { width: 8px; height: 8px; border-radius: 50%; background: #2a364f; }
    .sucker.lit { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    .sucker-label { font-size: 0.8rem; color: var(--text-sub); margin-left: 6px; }

    .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .tab-btn {
      background: var(--card-bg); backdrop-filter: blur(8px); color: var(--text-sub);
      border: 1px solid var(--card-border); padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    .tab-btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); box-shadow: 0 0 12px rgba(0, 240, 255, 0.5); }
    
    .add-stage-wrap { display: flex; align-items: center; gap: 8px; background: var(--card-bg); backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--card-border); }
    .add-stage-select { background: #070913; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; padding: 6px 10px; font-weight: bold; font-size: 0.85rem; }
    .btn-add-stage { background: var(--gold); color: #000; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }

    .table-container { background: var(--card-bg); backdrop-filter: blur(10px); border-radius: 8px; overflow-x: auto; border: 1px solid var(--card-border); margin-bottom: 28px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.85rem; }
    th, td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); white-space: nowrap; }
    th { background: rgba(7, 9, 19, 0.95); color: var(--text-sub); letter-spacing: 0.5px; }

    th.burst-col { background: rgba(255, 0, 85, 0.25); color: var(--pink); }
    td.burst-cell { background: rgba(255, 0, 85, 0.08); }

    .play-select {
      background: #070913; color: var(--text-main); border: 1px solid var(--card-border);
      border-radius: 4px; padding: 5px; width: 88px; text-align: center; font-weight: bold;
    }
    .play-select.has-value { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 6px rgba(0, 240, 255, 0.3); }

    .burst-check { width: 18px; height: 18px; accent-color: var(--pink); cursor: pointer; }

    .input-row-group { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
    .input-sub-row { display: flex; gap: 6px; justify-content: center; align-items: center; }

    .sum-cell { font-weight: bold; color: var(--gold); font-family: 'Orbitron', sans-serif; }
    .cum-cell { font-weight: bold; color: var(--cyan); font-family: 'Orbitron', sans-serif; }

    .diff-pos { color: #4ade80; text-shadow: 0 0 5px rgba(74, 222, 128, 0.4); }
    .diff-neg { color: #f87171; text-shadow: 0 0 5px rgba(248, 113, 113, 0.4); }

    .totals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; margin-bottom: 28px; }
    .total-card { background: var(--card-bg); backdrop-filter: blur(10px); padding: 18px; border-radius: 8px; border: 1px solid var(--card-border); }
    .total-card.grand { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
    .t-label { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 6px; }
    .t-value { font-size: 1.25rem; font-weight: bold; font-family: 'Orbitron', sans-serif; }
    .t-sub { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }

    .chart-container { background: var(--card-bg); backdrop-filter: blur(10px); padding: 18px; border-radius: 8px; border: 1px solid var(--card-border); height: 330px; margin-bottom: 28px; }

    .ctrl-bar { display: flex; justify-content: flex-end; }
    .btn-reset { background: var(--pink); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: 0 0 10px rgba(255, 0, 85, 0.4); }
  </style>
</head>
<body>

  <header>
    <div class="header-title-wrap">
      <!-- 로컬 파일로 추가한 crown.png (또는 crown.jpg) 이미지를 아이콘으로 불러옵니다 -->
      <img src="crown.png" alt="크라운 아이콘" class="kraken-icon" onerror="this.src='kraken.jpg'">
      <h1>크라운켄</h1>
    </div>
    <div class="header-right">
      <div class="level-box">
        <span>⚔️ 지휘관 레벨:</span>
        <input type="number" id="userLevelInput" class="level-input" value="350" min="1" max="1000">
      </div>
      <div id="saveStatus">서버 동기화 대기…</div>
      <button type="button" class="btn-action btn-load" id="manualFetchBtn">🔄 기록 불러오기</button>
      <button type="button" class="btn-action btn-save" id="manualSaveBtn">💾 기록 저장</button>
    </div>
  </header>

  <div class="grid-container" id="probGrid"></div>
  <div class="sucker-meter" id="suckerMeter"></div>
  
  <div class="tabs" id="stageTabs"></div>

  <!-- 입력 테이블 -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>일차</th>
          <th style="color:var(--pink)">🔥 풀버스트</th>
          <th>플레이 회차별 입력 (1~5회차)</th>
          <th>일일 합계</th>
          <th>누적 합계</th>
        </tr>
      </thead>
      <tbody id="inputBody"></tbody>
    </table>
  </div>

  <div class="ctrl-bar" style="margin-bottom: 28px;">
    <button class="btn-reset" id="resetBtn" type="button">현재 단계 기록 초기화</button>
  </div>

  <h2 style="font-size: 1.2rem; margin-bottom: 14px; color: var(--cyan); text-shadow: 0 0 8px var(--cyan);">30일 누적 통계 분석</h2>
  <div class="table-container">
    <table>
      <thead id="analysisHeader"></thead>
      <tbody id="analysisBody"></tbody>
    </table>
  </div>

  <div class="totals-grid" id="totalsGrid"></div>

  <div id="chartsWrapper">
    <div class="chart-container">
      <canvas id="cumChart"></canvas>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
  (function(){
    "use strict";

    const firebaseConfig = {
      apiKey: "AIzaSyAgkmoejYnv7qK6jtFfdzUHvuPceXBQxRE",
      authDomain: "kraken-log.firebaseapp.com",
      databaseURL: "https://kraken-log-default-rtdb.firebaseio.com",
      projectId: "kraken-log",
      storageBucket: "kraken-log.firebasestorage.app",
      messagingSenderId: "791595838017",
      appId: "1:791595838017:web:d424620f0a183e429b74c0"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    
    const database = firebase.database();
    const dbRef = database.ref('shared_kraken_full_data');

    var BASE_RATES = {
      1: 0.5300, 2: 0.5500, 3: 0.5700, 4: 0.5900, 5: 0.6100,
      6: 0.6300, 7: 0.6500, 8: 0.6700, 9: 0.6900
    };

    var items = [
      { id: '7', level: 7 },
      { id: '8', level: 8 },
      { id: '9', level: 9 }
    ];

    var DIST = {1:0.700963, 2:0.289037, 3:0.010000};
    var E_PER_BOX = 1*DIST[1] + 2*DIST[2] + 3*DIST[3];
    var DAYS = 30;

    var userAccountLevel = 350;

    function getMaxPlays(isBurst) {
      var base = 3;
      if (userAccountLevel >= 600) base = 5;
      else if (userAccountLevel >= 400) base = 4;
      return isBurst ? base * 2 : base;
    }

    function getRate(lvl){ return BASE_RATES[lvl] || 0.65; }
    function ePerPlay(lvl){ return getRate(lvl) * E_PER_BOX; }
    function fmt(n, d){ d = (d===undefined)?6:d; return n.toLocaleString('ko-KR', {minimumFractionDigits:d, maximumFractionDigits:d}); }
    function pct(n, d){ d = (d===undefined)?4:d; return (n*100).toFixed(d) + '%'; }

    var activeId = '7';
    var data = {};
    var isDataLoaded = false;

    function initItemData(id) {
      if(!data[id]) {
        data[id] = [];
        for(var i=0; i<DAYS; i++){
          data[id].push({
            isBurst: false,
            p: [null, null, null, null, null, null, null, null, null, null]
          });
        }
      }
    }

    items.forEach(function(item){ initItemData(item.id); });

    function setStatus(text){
      var el = document.getElementById('saveStatus');
      if(el) el.textContent = text;
    }

    function fetchServerData(isManual) {
      setStatus('데이터 불러오는 중…');
      dbRef.once('value').then(function(snapshot){
        var val = snapshot.val();
        if(val) {
          parseServerData(val);
          renderAll();
          setStatus('불러오기 완료!');
          if(isManual) alert('서버에서 최신 기록을 성공적으로 불러왔습니다.');
        } else {
          setStatus('서버 데이터 없음');
          if(isManual) alert('서버에 저장된 데이터가 없습니다.');
        }
      }).catch(function(err){
        console.error(err);
        setStatus('불러오기 실패');
      });
    }

    function saveDataToServer(isManual){
      if(!isDataLoaded && !isManual) return;

      setStatus('저장 중…');
      var stagesArr = items.map(function(x){ return x.level; });
      var boxRatesObj = {};
      items.forEach(function(x){ boxRatesObj[x.level] = getRate(x.level); });

      var dataToSave = {};
      items.forEach(function(item){
        dataToSave[item.id] = data[item.id];
        dataToSave[item.level] = data[item.id];
      });

      dbRef.set({ 
        stages: stagesArr, 
        boxRates: boxRatesObj, 
        items: items, 
        data: dataToSave,
        userLevel: userAccountLevel
      })
      .then(function(){
        var t = new Date();
        var timeStr = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
        setStatus('저장완료 (' + timeStr + ')');
        if(isManual){ alert('기록이 정상적으로 저장되었습니다.'); }
      })
      .catch(function(err){
        console.error(err);
        setStatus('저장 실패!');
      });
    }

    function renderProbGrid(){
      var grid = document.getElementById('probGrid');
      if(!grid) return;
      grid.innerHTML = '';
      
      var baseNormal = (userAccountLevel >= 600) ? 5 : ((userAccountLevel >= 400) ? 4 : 3);
      var baseBurst = baseNormal * 2;

      items.forEach(function(item){
        var id = item.id;
        var lvl = item.level;
        var card = document.createElement('div');
        card.className = 'prob-card';
        card.innerHTML =
          '<h3>' + lvl + '단계 <span class="stage-tag">STAGE ' + lvl + '</span>' +
          (items.length > 1 ? '<button class="btn-delete-stage" data-id="' + id + '">삭제</button>' : '') +
          '</h3>' +
          '<div class="prob-row"><span class="k">상자 획득 확률</span><span class="v cyan">' + pct(getRate(lvl)) + '</span></div>' +
          '<div class="prob-row"><span class="k">모듈 1개 드랍</span><span class="v">' + pct(DIST[1]) + '</span></div>' +
          '<div class="prob-row"><span class="k">모듈 2개 드랍</span><span class="v">' + pct(DIST[2]) + '</span></div>' +
          '<div class="prob-row"><span class="k">모듈 3개 드랍</span><span class="v">' + pct(DIST[3]) + '</span></div>' +
          '<div class="expect-line"><span class="lbl">1회당 기댓값</span><span class="num">' + fmt(ePerPlay(lvl)) + '개</span></div>' +
          '<div class="expect-line"><span class="lbl">일반일 (' + baseNormal + '회) 기댓값</span><span class="num">' + fmt(ePerPlay(lvl)*baseNormal) + '개</span></div>' +
          '<div class="expect-line"><span class="lbl">풀버스트 (' + baseBurst + '회) 기댓값</span><span class="num" style="color:var(--pink)">' + fmt(ePerPlay(lvl)*baseBurst) + '개</span></div>';
        grid.appendChild(card);
      });

      var delBtns = grid.querySelectorAll('.btn-delete-stage');
      delBtns.forEach(function(btn){
        btn.addEventListener('click', function(e){
          var targetId = e.target.getAttribute('data-id');
          if(confirm('이 단계를 삭제하시겠습니까?')) {
            items = items.filter(function(x){ return x.id !== targetId; });
            delete data[targetId];
            if(activeId === targetId) activeId = items[0].id;
            renderAll();
            saveDataToServer(false);
          }
        });
      });
    }

    function renderSuckerMeter(){
      var wrap = document.getElementById('suckerMeter');
      if(!wrap) return;
      wrap.innerHTML = '';
      items.forEach(function(item){
        var lvl = item.level;
        var lit = Math.round(getRate(lvl)*10);
        var row = document.createElement('div');
        row.style.display='flex'; row.style.alignItems='center'; row.style.marginRight='18px';
        var dots='';
        for(var i=0;i<10;i++){ dots += '<span class="sucker' + (i<lit?' lit':'') + '"></span>'; }
        row.innerHTML = dots + '<span class="sucker-label">' + lvl + '단계 (' + pct(getRate(lvl)) + ')</span>';
        row.style.gap='4px';
        wrap.appendChild(row);
      });
    }

    function renderTabs(){
      var tabs = document.getElementById('stageTabs');
      if(!tabs) return;
      tabs.innerHTML = '';
      items.forEach(function(item){
        var id = item.id;
        var lvl = item.level;
        var btn = document.createElement('button');
        btn.className = 'tab-btn' + (id===activeId?' active':'');
        btn.type = 'button';
        btn.textContent = lvl + '단계';
        btn.addEventListener('click', function(){
          activeId = id;
          renderTabs();
          renderInputGrid();
        });
        tabs.appendChild(btn);
      });

      var addWrap = document.createElement('div');
      addWrap.className = 'add-stage-wrap';

      var select = document.createElement('select');
      select.className = 'add-stage-select';
      for(var l=1; l<=9; l++){
        var opt = document.createElement('option');
        opt.value = l;
        opt.textContent = l + '단계 선택';
        if(l === 7) opt.selected = true;
        select.appendChild(opt);
      }

      var addBtn = document.createElement('button');
      addBtn.className = 'btn-add-stage';
      addBtn.type = 'button';
      addBtn.textContent = '+ 단계 추가';
      addBtn.addEventListener('click', function(){
        var chosenLevel = parseInt(select.value, 10);
        var newId = 'stage_' + chosenLevel + '_' + Date.now();
        items.push({ id: newId, level: chosenLevel });
        initItemData(newId);
        activeId = newId;
        renderAll();
        saveDataToServer(false);
      });

      addWrap.appendChild(select);
      addWrap.appendChild(addBtn);
      tabs.appendChild(addWrap);
    }

    function dayActualSum(id, dayIdx){
      var dayObj = data[id] ? data[id][dayIdx] : null;
      if(!dayObj) return 0;
      var sum = 0;
      var maxPlays = getMaxPlays(dayObj.isBurst);
      for(var i=0; i<maxPlays; i++){
        if(dayObj.p[i] !== null && dayObj.p[i] !== undefined) {
          sum += Number(dayObj.p[i]);
        }
      }
      return sum;
    }

    function dayExpectedSum(lvl, id, dayIdx){
      var dayObj = data[id] ? data[id][dayIdx] : null;
      var plays = getMaxPlays(dayObj && dayObj.isBurst);
      return ePerPlay(lvl) * plays;
    }

    function renderInputGrid(){
      var body = document.getElementById('inputBody');
      if(!body) return;
      body.innerHTML = '';
      var cum = 0;

      var normalLimit = (userAccountLevel >= 600) ? 5 : ((userAccountLevel >= 400) ? 4 : 3);

      for(var d=0; d<DAYS; d++){
        var dayData = (data[activeId] && data[activeId][d]) ? data[activeId][d] : { isBurst: false, p: [null,null,null,null,null,null,null,null,null,null] };
        var daySum = dayActualSum(activeId, d);
        cum += daySum;

        var tr = document.createElement('tr');

        var tdDay = document.createElement('td');
        tdDay.className = 'day-cell';
        tdDay.style.fontFamily = 'Orbitron, sans-serif';
        tdDay.textContent = 'D+' + (d+1);
        tr.appendChild(tdDay);

        var tdBurst = document.createElement('td');
        var chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.className = 'burst-check';
        chk.checked = !!dayData.isBurst;

        (function(dayIdx, checkboxEl){
          checkboxEl.addEventListener('change', function(){
            data[activeId][dayIdx].isBurst = checkboxEl.checked;
            var currentMax = getMaxPlays(checkboxEl.checked);
            for(var i = currentMax; i < 10; i++){
              data[activeId][dayIdx].p[i] = null;
            }
            renderInputGrid();
            renderAnalysis();
            saveDataToServer(false);
          });
        })(d, chk);

        tdBurst.appendChild(chk);
        tr.appendChild(tdBurst);

        var tdPlays = document.createElement('td');
        var groupDiv = document.createElement('div');
        groupDiv.className = 'input-row-group';

        var row1 = document.createElement('div');
        row1.className = 'input-sub-row';
        var row2 = document.createElement('div');
        row2.className = 'input-sub-row';

        var maxLimit = dayData.isBurst ? normalLimit * 2 : normalLimit;

        for(var p=0; p<maxLimit; p++){
          var sel = document.createElement('select');
          sel.className = 'play-select';
          sel.innerHTML = '<option value="">' + (p+1) + '회차</option><option value="0">0개</option><option value="1">1개</option><option value="2">2개</option><option value="3">3개</option>';

          var curVal = dayData.p[p];
          sel.value = (curVal === null || curVal === undefined) ? '' : String(curVal);
          if(curVal !== null && curVal !== undefined) sel.classList.add('has-value');

          (function(dayIdx, playIdx, selectEl){
            selectEl.addEventListener('change', function(){
              var v = selectEl.value;
              data[activeId][dayIdx].p[playIdx] = (v === '') ? null : parseInt(v, 10);
              renderInputGrid();
              renderAnalysis();
              saveDataToServer(false);
            });
          })(d, p, sel);

          if(p < normalLimit) {
            row1.appendChild(sel);
          } else {
            row2.appendChild(sel);
          }
        }

        groupDiv.appendChild(row1);
        if(maxLimit > normalLimit) {
          groupDiv.appendChild(row2);
        }
        tdPlays.appendChild(groupDiv);
        tr.appendChild(tdPlays);

        var tdSum = document.createElement('td');
        tdSum.className = 'sum-cell';
        tdSum.textContent = daySum + '개';
        tr.appendChild(tdSum);

        var tdCum = document.createElement('td');
        tdCum.className = 'cum-cell';
        tdCum.textContent = cum + '개';
        tr.appendChild(tdCum);

        body.appendChild(tr);
      }
    }

    function cumulativeArrays(item){
      var expArr = [], actArr = [];
      var ce = 0, ca = 0;
      for(var d=0; d<DAYS; d++){
        ce += dayExpectedSum(item.level, item.id, d);
        ca += dayActualSum(item.id, d);
        expArr.push(ce);
        actArr.push(ca);
      }
      return {exp: expArr, act: actArr};
    }

    function renderAnalysis(){
      var head = document.getElementById('analysisHeader');
      var body = document.getElementById('analysisBody');
      if(!head || !body) return;

      var tr1 = '<tr><th rowspan="2">일차</th>';
      var tr2 = '<tr>';
      items.forEach(function(item){
        tr1 += '<th colspan="3">' + item.level + '단계</th>';
        tr2 += '<th>기댓값</th><th>실제획득</th><th>차이</th>';
      });
      tr1 += '</tr>';
      tr2 += '</tr>';
      head.innerHTML = tr1 + tr2;

      body.innerHTML = '';
      var series = {};
      items.forEach(function(item){ series[item.id] = cumulativeArrays(item); });

      for(var d=0; d<DAYS; d++){
        var tr = document.createElement('tr');
        var tdDay = document.createElement('td');
        tdDay.className = 'day-cell';
        tdDay.style.fontFamily = 'Orbitron, sans-serif';
        tdDay.textContent = 'D+' + (d+1);
        tr.appendChild(tdDay);

        items.forEach(function(item){
          var exp = series[item.id].exp[d];
          var act = series[item.id].act[d];
          var diff = act - exp;
          var tdE = document.createElement('td'); tdE.textContent = fmt(exp);
          var tdA = document.createElement('td'); tdA.textContent = act + '개';
          var tdD = document.createElement('td');
          tdD.textContent = (diff>=0?'+':'') + fmt(diff);
          tdD.className = diff>=0 ? 'diff-pos' : 'diff-neg';
          tr.appendChild(tdE); tr.appendChild(tdA); tr.appendChild(tdD);
        });
        body.appendChild(tr);
      }

      renderTotals(series);
      renderCharts(series);
    }

    function renderTotals(series){
      var grid = document.getElementById('totalsGrid');
      if(!grid) return;
      grid.innerHTML = '';
      var grandExp = 0, grandAct = 0;

      items.forEach(function(item){
        var exp = series[item.id].exp[DAYS-1];
        var act = series[item.id].act[DAYS-1];
        grandExp += exp; grandAct += act;

        var card = document.createElement('div');
        card.className = 'total-card';
        card.innerHTML =
          '<div class="t-label">' + item.level + '단계 누적</div>' +
          '<div class="t-value expected" style="color:var(--gold)">' + fmt(exp) + '</div>' +
          '<div class="t-sub">기댓값 총합</div>' +
          '<div class="t-value actual" style="color:var(--cyan);margin-top:10px;">' + act + '개</div>' +
          '<div class="t-sub">실제 획득 (차이 ' + (act-exp>=0?'+':'') + fmt(act-exp) + ')</div>';
        grid.appendChild(card);
      });

      var grand = document.createElement('div');
      grand.className = 'total-card grand';
      grand.innerHTML =
        '<div class="t-label">전체 단계 합산</div>' +
        '<div class="t-value expected">' + fmt(grandExp) + '</div>' +
        '<div class="t-sub">기댓값 총합계</div>' +
        '<div class="t-value actual" style="margin-top:10px;">' + grandAct + '개</div>' +
        '<div class="t-sub">실제 총합계 (차이 ' + (grandAct-grandExp>=0?'+':'') + fmt(grandAct-grandExp) + ')</div>';
      grid.appendChild(grand);
    }

    var chartInstances = {};

    function renderCharts(series){
      if (typeof Chart === 'undefined') return;

      var labels = [];
      for(var d=1; d<=DAYS; d++) labels.push('D+'+d);
      var defaultColors = ['#00f0ff', '#ffbe00', '#ff0055', '#a855f7', '#22c55e', '#f97316'];

      var canvas1 = document.getElementById('cumChart');
      if(canvas1){
        var ctx1 = canvas1.getContext('2d');
        var datasets1 = [];
        items.forEach(function(item, idx){
          var color = defaultColors[idx % defaultColors.length];
          var title = item.level + '단계';
          datasets1.push({ label: title + ' (기대)', data: series[item.id].exp, borderColor: color, borderDash: [5,4], borderWidth: 1.5, pointRadius: 0 });
          datasets1.push({ label: title + ' (실제)', data: series[item.id].act, borderColor: color, borderWidth: 2.5, pointRadius: 0 });
        });

        if(chartInstances['cumChart']){ chartInstances['cumChart'].destroy(); }
        chartInstances['cumChart'] = new Chart(ctx1, {
          type: 'line',
          data: { labels: labels, datasets: datasets1 },
          options: { 
            responsive: true, 
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#f0f4f8' } } },
            scales: {
              x: { ticks: { color: '#8a99ad' }, grid: { color: 'rgba(255, 255, 255, 0.05)' } },
              y: { ticks: { color: '#8a99ad' }, grid: { color: 'rgba(255, 255, 255, 0.05)' } }
            }
          }
        });
      }
    }

    function parseServerData(val) {
      if(!val) return;

      if(val.userLevel !== undefined) {
        userAccountLevel = Number(val.userLevel);
        var lvlInput = document.getElementById('userLevelInput');
        if(lvlInput) lvlInput.value = userAccountLevel;
      }

      if (val.items && Array.isArray(val.items) && val.items.length > 0) {
        items = val.items;
      } else if (val.stages && Array.isArray(val.stages)) {
        items = val.stages.map(function(s){
          return { id: String(s), level: Number(s) };
        });
      }

      var rawData = val.data || val;

      items.forEach(function(item){
        initItemData(item.id);
        var itemObj = rawData[item.id] || rawData[item.level] || rawData[String(item.level)];
        if(itemObj){
          for(var d=0; d<DAYS; d++){
            var dayObj = itemObj[d];
            if(dayObj){
              var isBurst = !!dayObj.isBurst;
              var rawP = dayObj.p || [];
              var pArr = [];
              for(var i=0; i<10; i++){
                pArr[i] = (rawP[i] !== undefined && rawP[i] !== null) ? Number(rawP[i]) : null;
              }
              data[item.id][d] = { isBurst: isBurst, p: pArr };
            }
          }
        }
      });
      isDataLoaded = true;
    }

    function renderAll() {
      renderProbGrid();
      renderSuckerMeter();
      renderTabs();
      renderInputGrid();
      renderAnalysis();
    }

    function listenData(){
      dbRef.on('value', function(snapshot){
        var val = snapshot.val();
        if(val){
          parseServerData(val);
          setStatus('실시간 동기화 완료');
        } else {
          isDataLoaded = true;
          setStatus('연동 완료 (데이터 없음)');
        }
        renderAll();
      }, function(err){
        console.error(err);
        setStatus('서버 연동 오류');
      });
    }

    var levelInput = document.getElementById('userLevelInput');
    if(levelInput) {
      levelInput.addEventListener('change', function(){
        var val = parseInt(this.value, 10);
        if(!isNaN(val) && val > 0) {
          userAccountLevel = val;
          renderAll();
          saveDataToServer(false);
        }
      });
    }

    var manualFetchBtn = document.getElementById('manualFetchBtn');
    if(manualFetchBtn){
      manualFetchBtn.addEventListener('click', function(){
        fetchServerData(true);
      });
    }

    var manualSaveBtn = document.getElementById('manualSaveBtn');
    if(manualSaveBtn){
      manualSaveBtn.addEventListener('click', function(){
        saveDataToServer(true);
      });
    }

    var resetBtn = document.getElementById('resetBtn');
    if(resetBtn){
      resetBtn.addEventListener('click', function(){
        var ok = confirm('현재 활성화된 단계의 기록을 초기화하시겠습니까?');
        if(!ok) return;
        for(var i=0; i<DAYS; i++){
          data[activeId][i] = { isBurst: false, p: [null,null,null,null,null,null,null,null,null,null] };
        }
        renderInputGrid();
        renderAnalysis();
        saveDataToServer(false);
      });
    }

    renderAll();
    listenData();

  })();
  </script>
</body>
</html>
