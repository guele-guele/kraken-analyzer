<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>크라켄 모듈 누적 기록기</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --cyan: #37c7f0;
      --gold: #f0b429;
      --pink: #ff4757;
      --red: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); padding: 20px; max-width: 1000px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.4rem; color: var(--cyan); }
    #statusText { font-size: 0.85rem; color: var(--gold); font-weight: bold; }

    /* 입력 폼 영역 */
    .input-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 24px; }
    .input-card h2 { font-size: 1rem; color: var(--text-main); margin-bottom: 14px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 14px; }
    
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group label { font-size: 0.8rem; color: var(--text-sub); }
    .field-group select, .field-group input[type="number"] { background: #0f172a; color: var(--text-main); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 0.95rem; }
    
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 26px; cursor: pointer; user-select: none; }
    .checkbox-group input { width: 18px; height: 18px; accent-color: var(--pink); cursor: pointer; }
    .checkbox-group span { font-size: 0.9rem; font-weight: bold; color: var(--pink); }

    /* 추가 란 애니메이션 스타일 */
    .burst-field { background: rgba(255, 71, 87, 0.08); border: 1px dashed var(--pink); border-radius: 6px; padding: 8px; }
    .burst-field label { color: var(--pink); font-weight: bold; }

    .btn-add { width: 100%; background: var(--cyan); color: #000; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .btn-add:hover { opacity: 0.9; }

    /* 통계 요약 카드 */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .sum-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
    .sum-title { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; }
    .sum-value { font-size: 1.5rem; font-weight: bold; }

    /* 데이터 리스트 표 */
    .table-container { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.9rem; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #0f172a; color: var(--text-sub); }
    
    .badge-burst { background: rgba(255, 71, 87, 0.2); color: var(--pink); font-size: 0.75rem; font-weight: bold; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--pink); }
    .badge-normal { color: var(--text-sub); font-size: 0.8rem; }

    .btn-del { background: transparent; color: var(--red); border: 1px solid var(--red); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
    .btn-del:hover { background: var(--red); color: #fff; }

    .empty-msg { padding: 30px; text-align: center; color: var(--text-sub); font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>크라켄 모듈 누적 기록기</h1>
    <div id="statusText">서버 연결 중…</div>
  </header>

  <!-- 일차별 모듈 입력 폼 -->
  <div class="input-card">
    <h2>📝 일일 모듈 획득 기록 추가</h2>
    <form id="recordForm">
      <div class="form-grid">
        <div class="field-group">
          <label for="stageSelect">단계</label>
          <select id="stageSelect" required>
            <option value="7">7단계</option>
            <option value="8">8단계</option>
            <option value="9">9단계</option>
          </select>
        </div>

        <div class="field-group">
          <label for="dayInput">일차 (예: 1)</label>
          <input type="number" id="dayInput" min="1" max="100" placeholder="일차 입력" required>
        </div>

        <div class="field-group">
          <label for="moduleInput">기본 회차 모듈 (3회)</label>
          <input type="number" id="moduleInput" min="0" max="9" placeholder="0 ~ 9개" required>
        </div>

        <div class="field-group">
          <label class="checkbox-group">
            <input type="checkbox" id="fullBurstCheck">
            <span>🔥 풀버스트 데이</span>
          </label>
        </div>

        <!-- 풀버스트 체크 시 생성되는 추가 란 -->
        <div class="field-group burst-field" id="burstFieldGroup" style="display: none;">
          <label for="burstModuleInput">🔥 추가 회차 모듈 (+3회)</label>
          <input type="number" id="burstModuleInput" min="0" max="9" placeholder="0 ~ 9개">
        </div>
      </div>

      <button type="submit" class="btn-add">공유 서버에 기록 등록하기</button>
    </form>
  </div>

  <!-- 요약 통계 -->
  <div class="summary-grid">
    <div class="sum-card">
      <div class="sum-title">전체 등록 횟수</div>
      <div class="sum-value" id="totalCount" style="color:var(--text-main)">0회</div>
    </div>
    <div class="sum-card">
      <div class="sum-title">총 획득 모듈</div>
      <div class="sum-value" id="totalModules" style="color:var(--cyan)">0개</div>
    </div>
    <div class="sum-card">
      <div class="sum-title">누적 기댓값 합계</div>
      <div class="sum-value" id="expectedModules" style="color:var(--gold)">0개</div>
    </div>
  </div>

  <!-- 실시간 누적 기록 표 -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>등록 시간</th>
          <th>단계</th>
          <th>일차</th>
          <th>구분</th>
          <th>실제 획득 (기본 + 추가)</th>
          <th>1일 기댓값</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="logTableBody">
        <tr><td colspan="7" class="empty-msg">기록을 불러오는 중입니다…</td></tr>
      </tbody>
    </table>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
  (function(){
    "use strict";

    const firebaseConfig = {
      apiKey: "AIzaSyAgkmoejYnv7qK6jtFfdzUHvuPceXBQxRE",
      authDomain: "kraken-log.firebaseapp.com",
      databaseURL: "https://kraken-log-default-rtdb.firebaseio.com",
      projectId: "kraken-log",
      storageBucket: "kraken-log.firebasestorage.app",
      messagingSenderId: "791595838017",
      appId: "1:791595838017:web:d424620f0a183e429b74c0"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    
    const database = firebase.database();
    const dbRef = database.ref('kraken_logs_list');

    var BOX_RATES = { 7: 0.65, 8: 0.67, 9: 0.69 };
    var E_PER_BOX = 1 * 0.700963 + 2 * 0.289037 + 3 * 0.01;
    
    // 일반일: 3회 기준, 풀버스트일: 6회 기준 기댓값
    function getExpectedPerDay(stage, isFullBurst) {
      var plays = isFullBurst ? 6 : 3;
      return (BOX_RATES[stage] || 0.65) * E_PER_BOX * plays;
    }

    var statusEl = document.getElementById('statusText');
    var fullBurstCheck = document.getElementById('fullBurstCheck');
    var burstFieldGroup = document.getElementById('burstFieldGroup');
    var burstModuleInput = document.getElementById('burstModuleInput');

    // 풀버스트 체크박스 토글에 따라 추가 입력란 표시/숨김
    fullBurstCheck.addEventListener('change', function(){
      if(this.checked){
        burstFieldGroup.style.display = 'flex';
        burstModuleInput.required = true;
      } else {
        burstFieldGroup.style.display = 'none';
        burstModuleInput.required = false;
        burstModuleInput.value = '';
      }
    });

    // 폼 제출 핸들러
    document.getElementById('recordForm').addEventListener('submit', function(e){
      e.preventDefault();
      
      var stage = parseInt(document.getElementById('stageSelect').value, 10);
      var day = parseInt(document.getElementById('dayInput').value, 10);
      var regCount = parseInt(document.getElementById('moduleInput').value, 10);
      var isFullBurst = fullBurstCheck.checked;
      var burstCount = isFullBurst ? parseInt(burstModuleInput.value || '0', 10) : 0;
      var totalCount = regCount + burstCount;

      var newLog = {
        stage: stage,
        day: day,
        regCount: regCount,
        burstCount: burstCount,
        totalCount: totalCount,
        isFullBurst: isFullBurst,
        createdAt: new Date().toLocaleString('ko-KR')
      };

      statusEl.textContent = '저장 중…';
      dbRef.push(newLog)
        .then(function(){
          statusEl.textContent = '공유 저장 완료!';
          document.getElementById('moduleInput').value = '';
          burstModuleInput.value = '';
          if(fullBurstCheck.checked) {
            fullBurstCheck.checked = false;
            burstFieldGroup.style.display = 'none';
            burstModuleInput.required = false;
          }
          document.getElementById('dayInput').value = day + 1;
        })
        .catch(function(err){
          console.error(err);
          alert('저장 실패: Firebase 권한 규칙을 확인하세요.');
          statusEl.textContent = '저장 실패';
        });
    });

    window.deleteLog = function(key) {
      if(confirm('이 기록을 서버에서 삭제하시겠습니까?')){
        dbRef.child(key).remove();
      }
    };

    // 실시간 수신 및 표 렌더링
    dbRef.on('value', function(snapshot){
      var data = snapshot.val();
      var tbody = document.getElementById('logTableBody');
      tbody.innerHTML = '';

      if(!data){
        tbody.innerHTML = '<tr><td colspan="7" class="empty-msg">등록된 기록이 없습니다. 위 폼에서 작성해 보세요.</td></tr>';
        document.getElementById('totalCount').textContent = '0회';
        document.getElementById('totalModules').textContent = '0개';
        document.getElementById('expectedModules').textContent = '0개';
        statusEl.textContent = '실시간 공유 중 (데이터 없음)';
        return;
      }

      var totalAct = 0;
      var totalExp = 0;
      var itemCount = 0;

      var keys = Object.keys(data);
      var list = keys.map(function(k){
        return { key: k, val: data[k] };
      });

      list.sort(function(a,b){ return b.val.day - a.val.day; });

      list.forEach(function(item){
        var key = item.key;
        var log = item.val;
        itemCount++;

        // 호환성 처리 (이전 데이터 구조 지원)
        var actCount = log.totalCount !== undefined ? log.totalCount : (log.count || 0);
        var isBurst = !!log.isFullBurst;
        var exp = getExpectedPerDay(log.stage, isBurst);

        totalAct += actCount;
        totalExp += exp;

        var typeBadge = isBurst ? '<span class="badge-burst">🔥 풀버스트 (6회)</span>' : '<span class="badge-normal">일반 (3회)</span>';
        var detailText = isBurst ? log.regCount + ' + ' + log.burstCount + ' = ' : '';

        var tr = document.createElement('tr');
        tr.innerHTML = 
          '<td>' + (log.createdAt || '-') + '</td>' +
          '<td><strong style="color:var(--cyan)">' + log.stage + '단계</strong></td>' +
          '<td>D+' + log.day + '</td>' +
          '<td>' + typeBadge + '</td>' +
          '<td><strong style="color:var(--gold)">' + detailText + actCount + '개</strong></td>' +
          '<td>' + exp.toFixed(4) + '개</td>' +
          '<td><button class="btn-del" onclick="deleteLog(\'' + key + '\')">삭제</button></td>';
        
        tbody.appendChild(tr);
      });

      document.getElementById('totalCount').textContent = itemCount + '회';
      document.getElementById('totalModules').textContent = totalAct + '개';
      document.getElementById('expectedModules').textContent = totalExp.toFixed(2) + '개';

      statusEl.textContent = '실시간 동기화 완료';
    }, function(err){
      console.error(err);
      statusEl.textContent = '서버 연결 오류';
    });

  })();
  </script>
</body>
</html>
