<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>크라켄 분석기</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-bg-solid: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --cyan: #37c7f0;
      --gold: #f0b429;
      --pink: #ff4757;
      --border: rgba(51, 65, 85, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('kraken.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main); 
      padding: 20px; 
      max-width: 1300px; 
      margin: 0 auto; 
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); backdrop-filter: blur(4px); }
    h1 { font-size: 1.5rem; color: var(--cyan); text-shadow: 0 0 10px rgba(55,199,240,0.3); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    #saveStatus { font-size: 0.9rem; color: var(--gold); font-weight: bold; }
    .btn-manual-save { background: var(--cyan); color: #000; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-manual-save:hover { opacity: 0.9; }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .prob-card { background: var(--card-bg); backdrop-filter: blur(8px); padding: 16px; border-radius: 8px; border: 1px solid var(--border); position: relative; }
    .prob-card h3 { font-size: 1.1rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .stage-tag { font-size: 0.75rem; background: rgba(55,199,240,0.2); color: var(--cyan); padding: 2px 6px; border-radius: 4px; }
    .btn-delete-stage { background: transparent; border: 1px solid var(--pink); color: var(--pink); font-size: 0.7rem; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
    .btn-delete-stage:hover { background: var(--pink); color: #fff; }

    .prob-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-sub); }
    .prob-row .v { color: var(--text-main); font-weight: bold; }
    .prob-row .cyan { color: var(--cyan); }
    .expect-line { display: flex; justify-content: space-between; border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 8px; font-weight: bold; font-size: 0.9rem; }
    .expect-line .num { color: var(--gold); }

    .sucker-meter { display: flex; flex-wrap: wrap; background: var(--card-bg); backdrop-filter: blur(8px); padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; border: 1px solid var(--border); }
    .sucker { width: 8px; height: 8px; border-radius: 50%; background: #475569; }
    .sucker.lit { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
    .sucker-label { font-size: 0.8rem; color: var(--text-sub); margin-left: 6px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .tab-btn { background: var(--card-bg); backdrop-filter: blur(8px); color: var(--text-sub); border: 1px solid var(--border); padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); }
    .btn-add-stage { background: var(--gold); color: #000; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    .table-container { background: var(--card-bg); backdrop-filter: blur(8px); border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.85rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: rgba(15, 23, 42, 0.9); color: var(--text-sub); }

    th.burst-col { background: rgba(255, 71, 87, 0.2); color: var(--pink); }
    td.burst-cell { background: rgba(255, 71, 87, 0.08); }

    .play-select { background: rgba(15, 23, 42, 0.9); color: var(--text-main); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; }
    .play-select.has-value { border-color: var(--cyan); color: var(--cyan); font-weight: bold; }
    .play-select:disabled { opacity: 0.25; cursor: not-allowed; }

    .burst-check { width: 16px; height: 16px; accent-color: var(--pink); cursor: pointer; }

    .sum-cell { font-weight: bold; color: var(--gold); }
    .cum-cell { font-weight: bold; color: var(--cyan); }

    .diff-pos { color: #4ade80; }
    .diff-neg { color: #f87171; }

    .totals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .total-card { background: var(--card-bg); backdrop-filter: blur(8px); padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
    .total-card.grand { border-color: var(--cyan); }
    .t-label { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
    .t-value { font-size: 1.2rem; font-weight: bold; }
    .t-sub { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }

    .chart-container { background: var(--card-bg); backdrop-filter: blur(8px); padding: 16px; border-radius: 8px; border: 1px solid var(--border); height: 320px; margin-bottom: 24px; }

    .ctrl-bar { display: flex; justify-content: flex-end; }
    .btn-reset { background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>크라켄 분석기</h1>
    <div class="header-right">
      <div id="saveStatus">서버 연결 중…</div>
      <button type="button" class="btn-manual-save" id="manualSaveBtn">💾 기록 저장하기</button>
    </div>
  </header>

  <div class="grid-container" id="probGrid"></div>
  <div class="sucker-meter" id="suckerMeter"></div>
  
  <div class="tabs" id="stageTabs"></div>

  <!-- 입력 테이블 -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>일차</th>
          <th style="color:var(--pink)">🔥 풀버스트</th>
          <th>1회차</th>
          <th>2회차</th>
          <th>3회차</th>
          <th class="burst-col">4회차 (추가)</th>
          <th class="burst-col">5회차 (추가)</th>
          <th class="burst-col">6회차 (추가)</th>
          <th>일일 합계</th>
          <th>누적 합계</th>
        </tr>
      </thead>
      <tbody id="inputBody"></tbody>
    </table>
  </div>

  <div class="ctrl-bar" style="margin-bottom: 24px;">
    <button class="btn-reset" id="resetBtn" type="button">현재 단계 기록 초기화</button>
  </div>

  <h2 style="font-size: 1.2rem; margin-bottom: 12px; color: var(--text-main); text-shadow: 0 1px 4px rgba(0,0,0,0.8);">30일 누적 분석 및 기댓값 비교</h2>
  <div class="table-container">
    <table>
      <thead id="analysisHeader"></thead>
      <tbody id="analysisBody"></tbody>
    </table>
  </div>

  <div class="totals-grid" id="totalsGrid"></div>

  <!-- 차트 추가가 용이한 래퍼 영역 -->
  <div id="chartsWrapper">
    <div class="chart-container">
      <canvas id="cumChart"></canvas>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
  (function(){
    "use strict";

    const firebaseConfig = {
      apiKey: "AIzaSyAgkmoejYnv7qK6jtFfdzUHvuPceXBQxRE",
      authDomain: "kraken-log.firebaseapp.com",
      databaseURL: "https://kraken-log-default-rtdb.firebaseio.com",
      projectId: "kraken-log",
      storageBucket: "kraken-log.firebasestorage.app",
      messagingSenderId: "791595838017",
      appId: "1:791595838017:web:d424620f0a183e429b74c0"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    
    const database = firebase.database();
    const dbRef = database.ref('shared_kraken_full_data');

    // 동적 단계 관리를 위한 동적 배열 구조
    var STAGES = [7, 8, 9];
    var BOX_RATE = {7:0.6500, 8:0.6700, 9:0.6900};
    var DIST = {1:0.700963, 2:0.289037, 3:0.010000};
    var E_PER_BOX = 1*DIST[1] + 2*DIST[2] + 3*DIST[3];
    var DAYS = 30;

    function ePerPlay(s){ 
      var rate = BOX_RATE[s] !== undefined ? BOX_RATE[s] : 0.65; // 기본 확률 지정
      return rate * E_PER_BOX; 
    }
    function fmt(n, d){ d = (d===undefined)?6:d; return n.toLocaleString('ko-KR', {minimumFractionDigits:d, maximumFractionDigits:d}); }
    function pct(n, d){ d = (d===undefined)?4:d; return (n*100).toFixed(d) + '%'; }

    var activeStage = 7;
    var data = {};
    
    function initStageData(s) {
      if(!data[s]) {
        data[s] = [];
        for(var i=0; i<DAYS; i++){
          data[s].push({
            isBurst: false,
            p: [null, null, null, null, null, null]
          });
        }
      }
    }

    function initEmptyData() {
      STAGES.forEach(function(s){ initStageData(s); });
    }
    initEmptyData();

    function setStatus(text){
      var el = document.getElementById('saveStatus');
      if(el) el.textContent = text;
    }

    function saveDataToServer(isManual){
      setStatus('저장 중…');
      dbRef.set({ stages: STAGES, boxRates: BOX_RATE, data: data })
        .then(function(){
          var t = new Date();
          var timeStr = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
          setStatus('저장완료 (' + timeStr + ')');
          if(isManual){ alert('서버에 정상적으로 저장되었습니다!'); }
        })
        .catch(function(err){
          console.error(err);
          setStatus('저장 실패!');
        });
    }

    function renderProbGrid(){
      var grid = document.getElementById('probGrid');
      if(!grid) return;
      grid.innerHTML = '';
      STAGES.forEach(function(s){
        var rate = BOX_RATE[s] !== undefined ? BOX_RATE[s] : 0.65;
        var card = document.createElement('div');
        card.className = 'prob-card';
        card.innerHTML =
          '<h3>' + s + '단계 <span class="stage-tag">STAGE ' + s + '</span>' +
          (STAGES.length > 1 ? '<button class="btn-delete-stage" data-stage="' + s + '">삭제</button>' : '') +
          '</h3>' +
          '<div class="prob-row"><span class="k">상자 획득 확률</span><span class="v cyan">' + pct(rate) + '</span></div>' +
          '<div class="prob-row"><span class="k">모듈 1개 획득</span><span class="v">' + pct(DIST[1]) + '</span></div>' +
          '<div class="prob-row"><span class="k">모듈 2개 획득</span><span class="v">' + pct(DIST[2]) + '</span></div>' +
          '<div class="prob-row"><span class="k">모듈 3개 획득</span><span class="v">' + pct(DIST[3]) + '</span></div>' +
          '<div class="expect-line"><span class="lbl">1회당 기댓값</span><span class="num">' + fmt(ePerPlay(s)) + '개</span></div>' +
          '<div class="expect-line"><span class="lbl">일반일(3회) 기댓값</span><span class="num">' + fmt(ePerPlay(s)*3) + '개</span></div>' +
          '<div class="expect-line"><span class="lbl">풀버스트(6회) 기댓값</span><span class="num" style="color:var(--pink)">' + fmt(ePerPlay(s)*6) + '개</span></div>';
        grid.appendChild(card);
      });

      // 삭제 버튼 이벤트 바인딩
      var delBtns = grid.querySelectorAll('.btn-delete-stage');
      delBtns.forEach(function(btn){
        btn.addEventListener('click', function(e){
          var stg = parseInt(e.target.getAttribute('data-stage'), 10);
          if(confirm(stg + '단계를 삭제하시겠습니까?')) {
            STAGES = STAGES.filter(function(x){ return x !== stg; });
            delete data[stg];
            delete BOX_RATE[stg];
            if(activeStage === stg) activeStage = STAGES[0];
            renderAll();
            saveDataToServer(false);
          }
        });
      });
    }

    function renderSuckerMeter(){
      var wrap = document.getElementById('suckerMeter');
      if(!wrap) return;
      wrap.innerHTML = '';
      STAGES.forEach(function(s){
        var rate = BOX_RATE[s] !== undefined ? BOX_RATE[s] : 0.65;
        var lit = Math.round(rate*10);
        var row = document.createElement('div');
        row.style.display='flex'; row.style.alignItems='center'; row.style.marginRight='18px';
        var dots='';
        for(var i=0;i<10;i++){ dots += '<span class="sucker' + (i<lit?' lit':'') + '"></span>'; }
        row.innerHTML = dots + '<span class="sucker-label">' + s + '단계 ' + pct(rate) + '</span>';
        row.style.gap='4px';
        wrap.appendChild(row);
      });
    }

    function renderTabs(){
      var tabs = document.getElementById('stageTabs');
      if(!tabs) return;
      tabs.innerHTML = '';
      STAGES.forEach(function(s){
        var btn = document.createElement('button');
        btn.className = 'tab-btn' + (s===activeStage?' active':'');
        btn.type = 'button';
        btn.textContent = s + '단계 입력';
        btn.addEventListener('click', function(){
          activeStage = s;
          renderTabs();
          renderInputGrid();
        });
        tabs.appendChild(btn);
      });

      // 유저가 직접 새 단계를 추가할 수 있는 버튼
      var addBtn = document.createElement('button');
      addBtn.className = 'btn-add-stage';
      addBtn.type = 'button';
      addBtn.textContent = '+ 새 단계 추가';
      addBtn.addEventListener('click', function(){
        var newStage = prompt('추가할 단계 번호를 입력하세요 (예: 10):');
        if(newStage) {
          var num = parseInt(newStage, 10);
          if(!isNaN(num) && STAGES.indexOf(num) === -1) {
            STAGES.push(num);
            STAGES.sort(function(a,b){ return a-b; });
            BOX_RATE[num] = 0.70; // 기본 확률값 할당
            initStageData(num);
            activeStage = num;
            renderAll();
            saveDataToServer(false);
          } else {
            alert('올바르지 않거나 이미 존재하는 단계입니다.');
          }
        }
      });
      tabs.appendChild(addBtn);
    }

    function dayActualSum(stage, dayIdx){
      var dayObj = data[stage] ? data[stage][dayIdx] : null;
      if(!dayObj) return 0;
      var sum = 0;
      var maxPlays = dayObj.isBurst ? 6 : 3;
      for(var i=0; i<maxPlays; i++){
        if(dayObj.p[i] !== null && dayObj.p[i] !== undefined) {
          sum += Number(dayObj.p[i]);
        }
      }
      return sum;
    }

    function dayExpectedSum(stage, dayIdx){
      var dayObj = data[stage] ? data[stage][dayIdx] : null;
      var plays = (dayObj && dayObj.isBurst) ? 6 : 3;
      return ePerPlay(stage) * plays;
    }

    function renderInputGrid(){
      var body = document.getElementById('inputBody');
      if(!body) return;
      body.innerHTML = '';
      var cum = 0;

      for(var d=0; d<DAYS; d++){
        var dayData = (data[activeStage] && data[activeStage][d]) ? data[activeStage][d] : { isBurst: false, p: [null,null,null,null,null,null] };
        var daySum = dayActualSum(activeStage, d);
        cum += daySum;

        var tr = document.createElement('tr');

        var tdDay = document.createElement('td');
        tdDay.className = 'day-cell';
        tdDay.textContent = 'D+' + (d+1);
        tr.appendChild(tdDay);

        var tdBurst = document.createElement('td');
        var chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.className = 'burst-check';
        chk.checked = !!dayData.isBurst;

        (function(dayIdx, checkboxEl){
          checkboxEl.addEventListener('change', function(){
            data[activeStage][dayIdx].isBurst = checkboxEl.checked;
            if(!checkboxEl.checked){
              data[activeStage][dayIdx].p[3] = null;
              data[activeStage][dayIdx].p[4] = null;
              data[activeStage][dayIdx].p[5] = null;
            }
            renderInputGrid();
            renderAnalysis();
            saveDataToServer(false);
          });
        })(d, chk);

        tdBurst.appendChild(chk);
        tr.appendChild(tdBurst);

        for(var p=0; p<6; p++){
          var td = document.createElement('td');
          if(p >= 3) td.className = 'burst-cell';

          var sel = document.createElement('select');
          sel.className = 'play-select';
          sel.innerHTML = '<option value="">-</option><option value="0">0 (박스X)</option><option value="1">1개</option><option value="2">2개</option><option value="3">3개</option>';

          if(p >= 3 && !dayData.isBurst){
            sel.disabled = true;
          }

          var curVal = dayData.p[p];
          sel.value = (curVal === null || curVal === undefined) ? '' : String(curVal);
          if(curVal !== null && curVal !== undefined && (!sel.disabled)) sel.classList.add('has-value');

          (function(dayIdx, playIdx, selectEl){
            selectEl.addEventListener('change', function(){
              var v = selectEl.value;
              data[activeStage][dayIdx].p[playIdx] = (v === '') ? null : parseInt(v, 10);
              renderInputGrid();
              renderAnalysis();
              saveDataToServer(false);
            });
          })(d, p, sel);

          td.appendChild(sel);
          tr.appendChild(td);
        }

        var tdSum = document.createElement('td');
        tdSum.className = 'sum-cell';
        tdSum.textContent = daySum + '개';
        tr.appendChild(tdSum);

        var tdCum = document.createElement('td');
        tdCum.className = 'cum-cell';
        tdCum.textContent = cum + '개';
        tr.appendChild(tdCum);

        body.appendChild(tr);
      }
    }

    function cumulativeArrays(stage){
      var expArr = [], actArr = [];
      var ce = 0, ca = 0;
      for(var d=0; d<DAYS; d++){
        ce += dayExpectedSum(stage, d);
        ca += dayActualSum(stage, d);
        expArr.push(ce);
        actArr.push(ca);
      }
      return {exp: expArr, act: actArr};
    }

    function renderAnalysis(){
      var head = document.getElementById('analysisHeader');
      var body = document.getElementById('analysisBody');
      if(!head || !body) return;

      // 동적 테이블 헤더 생성
      var tr1 = '<tr><th rowspan="2">일차</th>';
      var tr2 = '<tr>';
      STAGES.forEach(function(s){
        tr1 += '<th colspan="3">' + s + '단계</th>';
        tr2 += '<th>기대</th><th>실제</th><th>차이</th>';
      });
      tr1 += '</tr>';
      tr2 += '</tr>';
      head.innerHTML = tr1 + tr2;

      body.innerHTML = '';
      var series = {};
      STAGES.forEach(function(s){ series[s] = cumulativeArrays(s); });

      for(var d=0; d<DAYS; d++){
        var tr = document.createElement('tr');
        var tdDay = document.createElement('td');
        tdDay.className = 'day-cell';
        tdDay.textContent = 'D+' + (d+1);
        tr.appendChild(tdDay);

        STAGES.forEach(function(s){
          var exp = series[s].exp[d];
          var act = series[s].act[d];
          var diff = act - exp;
          var tdE = document.createElement('td'); tdE.textContent = fmt(exp);
          var tdA = document.createElement('td'); tdA.textContent = act + '개';
          var tdD = document.createElement('td');
          tdD.textContent = (diff>=0?'+':'') + fmt(diff);
          tdD.className = diff>=0 ? 'diff-pos' : 'diff-neg';
          tr.appendChild(tdE); tr.appendChild(tdA); tr.appendChild(tdD);
        });
        body.appendChild(tr);
      }

      renderTotals(series);
      renderCharts(series);
    }

    function renderTotals(series){
      var grid = document.getElementById('totalsGrid');
      if(!grid) return;
      grid.innerHTML = '';
      var grandExp = 0, grandAct = 0;

      STAGES.forEach(function(s){
        var exp = series[s].exp[DAYS-1];
        var act = series[s].act[DAYS-1];
        grandExp += exp; grandAct += act;

        var card = document.createElement('div');
        card.className = 'total-card';
        card.innerHTML =
          '<div class="t-label">' + s + '단계 · 누적</div>' +
          '<div class="t-value expected" style="color:var(--gold)">' + fmt(exp) + '</div>' +
          '<div class="t-sub">기댓값 합계 (개)</div>' +
          '<div class="t-value actual" style="color:var(--cyan);margin-top:10px;">' + act + '</div>' +
          '<div class="t-sub">실제 획득 (개) · 차이 ' + (act-exp>=0?'+':'') + fmt(act-exp) + '</div>';
        grid.appendChild(card);
      });

      var grand = document.createElement('div');
      grand.className = 'total-card grand';
      grand.innerHTML =
        '<div class="t-label">전체 단계 합산</div>' +
        '<div class="t-value expected">' + fmt(grandExp) + '</div>' +
        '<div class="t-sub">기댓값 총합계 (개)</div>' +
        '<div class="t-value actual" style="margin-top:10px;">' + grandAct + '</div>' +
        '<div class="t-sub">실제 총합계 (개) · 차이 ' + (grandAct-grandExp>=0?'+':'') + fmt(grandAct-grandExp) + '</div>';
      grid.appendChild(grand);
    }

    var chartInstances = {};

    function renderCharts(series){
      if (typeof Chart === 'undefined') return;

      var labels = [];
      for(var d=1; d<=DAYS; d++) labels.push('D+'+d);
      var defaultColors = ['#37c7f0', '#f0b429', '#e0679a', '#a855f7', '#22c55e', '#f97316'];

      var canvas1 = document.getElementById('cumChart');
      if(canvas1){
        var ctx1 = canvas1.getContext('2d');
        var datasets1 = [];
        STAGES.forEach(function(s, idx){
          var color = defaultColors[idx % defaultColors.length];
          datasets1.push({ label: s+'단계 기대', data: series[s].exp, borderColor: color, borderDash: [5,4], borderWidth: 1.5, pointRadius: 0 });
          datasets1.push({ label: s+'단계 실제', data: series[s].act, borderColor: color, borderWidth: 2.5, pointRadius: 0 });
        });

        if(chartInstances['cumChart']){ chartInstances['cumChart'].destroy(); }
        chartInstances['cumChart'] = new Chart(ctx1, {
          type: 'line',
          data: { labels: labels, datasets: datasets1 },
          options: { 
            responsive: true, 
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#f8fafc' } } },
            scales: {
              x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(51, 65, 85, 0.5)' } },
              y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(51, 65, 85, 0.5)' } }
            }
          }
        });
      }
    }

    function parseServerData(val) {
      if(!val) return;
      if(val.stages) STAGES = val.stages;
      if(val.boxRates) BOX_RATE = val.boxRates;
      var rawData = val.data || val;

      STAGES.forEach(function(s){
        initStageData(s);
        var stageObj = rawData[s];
        if(stageObj){
          for(var d=0; d<DAYS; d++){
            var dayObj = stageObj[d];
            if(dayObj){
              var isBurst = !!dayObj.isBurst;
              var rawP = dayObj.p || [];
              var pArr = [];
              for(var i=0; i<6; i++){
                pArr[i] = (rawP[i] !== undefined && rawP[i] !== null) ? Number(rawP[i]) : null;
              }
              data[s][d] = { isBurst: isBurst, p: pArr };
            }
          }
        }
      });
    }

    function renderAll() {
      renderProbGrid();
      renderSuckerMeter();
      renderTabs();
      renderInputGrid();
      renderAnalysis();
    }

    function listenData(){
      dbRef.on('value', function(snapshot){
        var val = snapshot.val();
        if(val){
          parseServerData(val);
          setStatus('실시간 동기화 완료');
        } else {
          setStatus('연동 완료 (데이터 없음)');
        }
        renderAll();
      }, function(err){
        console.error(err);
        setStatus('서버 연동 오류!');
      });
    }

    var manualSaveBtn = document.getElementById('manualSaveBtn');
    if(manualSaveBtn){
      manualSaveBtn.addEventListener('click', function(){
        saveDataToServer(true);
      });
    }

    var resetBtn = document.getElementById('resetBtn');
    if(resetBtn){
      resetBtn.addEventListener('click', function(){
        var ok = confirm('공유되는 ' + activeStage + '단계 기록을 초기화하시겠습니까?');
        if(!ok) return;
        for(var i=0; i<DAYS; i++){
          data[activeStage][i] = { isBurst: false, p: [null,null,null,null,null,null] };
        }
        renderInputGrid();
        renderAnalysis();
        saveDataToServer(false);
      });
    }

    renderAll();
    listenData();

  })();
  </script>
</body>
</html>
