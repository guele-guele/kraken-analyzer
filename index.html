<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>크라켄 분석기</title>
  <!-- Chart.js 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --cyan: #37c7f0;
      --gold: #f0b429;
      --pink: #e0679a;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); padding: 20px; max-width: 1200px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.5rem; color: var(--cyan); }
    #saveStatus { font-size: 0.9rem; color: var(--gold); }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .prob-card { background: var(--card-bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
    .prob-card h3 { font-size: 1.1rem; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .stage-tag { font-size: 0.75rem; background: rgba(55,199,240,0.2); color: var(--cyan); padding: 2px 6px; border-radius: 4px; }
    .prob-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-sub); }
    .prob-row .v { color: var(--text-main); font-weight: bold; }
    .prob-row .cyan { color: var(--cyan); }
    .expect-line { display: flex; justify-content: space-between; border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 8px; font-weight: bold; font-size: 0.9rem; }
    .expect-line .num { color: var(--gold); }

    .sucker-meter { display: flex; flex-wrap: wrap; background: var(--card-bg); padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; border: 1px solid var(--border); }
    .sucker { width: 8px; height: 8px; border-radius: 50%; background: #475569; }
    .sucker.lit { background: var(--cyan); }
    .sucker-label { font-size: 0.8rem; color: var(--text-sub); margin-left: 6px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { background: var(--card-bg); color: var(--text-sub); border: 1px solid var(--border); padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); }

    .table-container { background: var(--card-bg); border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.85rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #0f172a; color: var(--text-sub); }
    .play-select { background: #0f172a; color: var(--text-main); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; }
    .play-select.has-value { border-color: var(--cyan); color: var(--cyan); font-weight: bold; }
    .sum-cell { font-weight: bold; color: var(--gold); }
    .cum-cell { font-weight: bold; color: var(--cyan); }

    .diff-pos { color: #4ade80; }
    .diff-neg { color: #f87171; }

    .totals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .total-card { background: var(--card-bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
    .total-card.grand { border-color: var(--cyan); }
    .t-label { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
    .t-value { font-size: 1.2rem; font-weight: bold; }
    .t-sub { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }

    .chart-container { background: var(--card-bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border); height: 320px; margin-bottom: 24px; }

    .ctrl-bar { display: flex; justify-content: flex-end; }
    .btn-reset { background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>크라켄 분석기</h1>
    <div id="saveStatus">연동 준비 중…</div>
  </header>

  <!-- 확률 정보 Grid -->
  <div class="grid-container" id="probGrid"></div>

  <!-- 단계별 기댓값 요약 바 -->
  <div class="sucker-meter" id="suckerMeter"></div>

  <!-- 입력 탭 -->
  <div class="tabs" id="stageTabs"></div>

  <!-- 일자별 입력 테이블 -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>일차</th>
          <th>1회차</th>
          <th>2회차</th>
          <th>3회차</th>
          <th>일일 합계</th>
          <th>누적 합계</th>
        </tr>
      </thead>
      <tbody id="inputBody"></tbody>
    </table>
  </div>

  <!-- 컨트롤 버튼 -->
  <div class="ctrl-bar" style="margin-bottom: 24px;">
    <button class="btn-reset" id="resetBtn" type="button">현재 단계 기록 초기화</button>
  </div>

  <!-- 종합 분석 테이블 -->
  <h2 style="font-size: 1.2rem; margin-bottom: 12px; color: var(--text-main);">30일 누적 분석 및 기댓값 비교</h2>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th rowspan="2">일차</th>
          <th colspan="3">7단계</th>
          <th colspan="3">8단계</th>
          <th colspan="3">9단계</th>
        </tr>
        <tr>
          <th>기대</th><th>실제</th><th>차이</th>
          <th>기대</th><th>실제</th><th>차이</th>
          <th>기대</th><th>실제</th><th>차이</th>
        </tr>
      </thead>
      <tbody id="analysisBody"></tbody>
    </table>
  </div>

  <!-- 최종 누적 토탈 -->
  <div class="totals-grid" id="totalsGrid"></div>

  <!-- 누적 그래프 -->
  <div class="chart-container">
    <canvas id="cumChart"></canvas>
  </div>

  <!-- Firebase SDK 로드 -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
  (function(){
    "use strict";

    // 사용자 Firebase 설정 적용
    const firebaseConfig = {
      apiKey: "AIzaSyAgkmoejYnv7qK6jtFfdzUHvuPceXBQxRE",
      authDomain: "kraken-log.firebaseapp.com",
      databaseURL: "https://kraken-log-default-rtdb.firebaseio.com",
      projectId: "kraken-log",
      storageBucket: "kraken-log.firebasestorage.app",
      messagingSenderId: "791595838017",
      appId: "1:791595838017:web:d424620f0a183e429b74c0"
    };

    // Firebase 초기화
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const dbRef = database.ref('kraken_data');

    // ---------- 확률 및 상태 변수 ----------
    var STAGES = [7,8,9];
    var BOX_RATE = {7:0.6500, 8:0.6700, 9:0.6900};
    var DIST = {1:0.700963, 2:0.289037, 3:0.010000};
    var E_PER_BOX = 1*DIST[1] + 2*DIST[2] + 3*DIST[3];
    var PLAYS_PER_DAY = 3;
    var DAYS = 30;

    function ePerPlay(s){ return BOX_RATE[s] * E_PER_BOX; }
    function ePerDay(s){ return ePerPlay(s) * PLAYS_PER_DAY; }
    function fmt(n, d){ d = (d===undefined)?6:d; return n.toLocaleString('ko-KR', {minimumFractionDigits:d, maximumFractionDigits:d}); }
    function pct(n, d){ d = (d===undefined)?4:d; return (n*100).toFixed(d) + '%'; }

    var activeStage = 7;
    var data = {};
    STAGES.forEach(function(s){
      data[s] = [];
      for(var i=0;i<DAYS;i++) data[s].push([null,null,null]);
    });

    // ---------- 렌더링 함수들 ----------
    function renderProbGrid(){
      var grid = document.getElementById('probGrid');
      if(!grid) return;
      grid.innerHTML = '';
      STAGES.forEach(function(s){
        var card = document.createElement('div');
        card.className = 'prob-card';
        card.innerHTML =
          '<h3>' + s + '단계 <span class="stage-tag">STAGE ' + s + '</span></h3>' +
          '<div class="prob-row"><span class="k">상자 획득 확률</span><span class="v cyan">' + pct(BOX_RATE[s]) + '</span></div>' +
          '<div class="prob-row"><span class="k">모듈 1개 획득</span><span class="v">' + pct(DIST[1]) + '</span></div>' +
          '<div class="prob-row"><span class="k">모듈 2개 획득</span><span class="v">' + pct(DIST[2]) + '</span></div>' +
          '<div class="prob-row"><span class="k">모듈 3개 획득</span><span class="v">' + pct(DIST[3]) + '</span></div>' +
          '<div class="expect-line"><span class="lbl">1회당 기댓값</span><span class="num">' + fmt(ePerPlay(s)) + '개</span></div>' +
          '<div class="expect-line"><span class="lbl">30일 누적 기댓값</span><span class="num">' + fmt(ePerDay(s)*DAYS) + '개</span></div>';
        grid.appendChild(card);
      });
    }

    function renderSuckerMeter(){
      var wrap = document.getElementById('suckerMeter');
      if(!wrap) return;
      wrap.innerHTML = '';
      STAGES.forEach(function(s){
        var rate = BOX_RATE[s];
        var lit = Math.round(rate*10);
        var row = document.createElement('div');
        row.style.display='flex'; row.style.alignItems='center'; row.style.marginRight='18px';
        var dots='';
        for(var i=0;i<10;i++){ dots += '<span class="sucker' + (i<lit?' lit':'') + '"></span>'; }
        row.innerHTML = dots + '<span class="sucker-label">' + s + '단계 ' + pct(rate) + '</span>';
        row.style.gap='4px';
        wrap.appendChild(row);
      });
    }

    function renderTabs(){
      var tabs = document.getElementById('stageTabs');
      if(!tabs) return;
      tabs.innerHTML = '';
      STAGES.forEach(function(s){
        var btn = document.createElement('button');
        btn.className = 'tab-btn' + (s===activeStage?' active':'');
        btn.type = 'button';
        btn.textContent = s + '단계 입력';
        btn.addEventListener('click', function(){
          activeStage = s;
          renderTabs();
          renderInputGrid();
        });
        tabs.appendChild(btn);
      });
    }

    function dayActualSum(stage, dayIdx){
      var vals = data[stage][dayIdx];
      var sum = 0;
      for(var i=0;i<vals.length;i++){ if(vals[i]!==null) sum += vals[i]; }
      return sum;
    }

    function renderInputGrid(){
      var body = document.getElementById('inputBody');
      if(!body) return;
      body.innerHTML = '';
      var cum = 0;
      for(var d=0; d<DAYS; d++){
        var daySum = dayActualSum(activeStage, d);
        cum += daySum;
        var tr = document.createElement('tr');

        var tdDay = document.createElement('td');
        tdDay.className = 'day-cell';
        tdDay.textContent = 'D+' + (d+1);
        tr.appendChild(tdDay);

        for(var p=0; p<3; p++){
          var td = document.createElement('td');
          var sel = document.createElement('select');
          sel.className = 'play-select';
          var opts = ['<option value="">-</option>','<option value="0">0 (박스X)</option>','<option value="1">1개</option>','<option value="2">2개</option>','<option value="3">3개</option>'];
          sel.innerHTML = opts.join('');
          var cur = data[activeStage][d][p];
          sel.value = (cur===null) ? '' : String(cur);
          if(cur!==null) sel.classList.add('has-value');
          (function(dayIdx, playIdx, selectEl){
            selectEl.addEventListener('change', function(){
              var v = selectEl.value;
              data[activeStage][dayIdx][playIdx] = (v==='') ? null : parseInt(v,10);
              selectEl.classList.toggle('has-value', v!=='');
              renderInputGrid();
              renderAnalysis();
              scheduleSave();
            });
          })(d, p, sel);
          td.appendChild(sel);
          tr.appendChild(td);
        }

        var tdSum = document.createElement('td');
        tdSum.className = 'sum-cell';
        tdSum.textContent = daySum + '개';
        tr.appendChild(tdSum);

        var tdCum = document.createElement('td');
        tdCum.className = 'cum-cell';
        tdCum.textContent = cum + '개';
        tr.appendChild(tdCum);

        body.appendChild(tr);
      }
    }

    var chartInstance = null;
    function cumulativeArrays(stage){
      var expArr = [], actArr = [];
      var ce = 0, ca = 0;
      for(var d=0; d<DAYS; d++){
        ce += ePerDay(stage);
        ca += dayActualSum(stage, d);
        expArr.push(ce);
        actArr.push(ca);
      }
      return {exp: expArr, act: actArr};
    }

    function renderAnalysis(){
      var body = document.getElementById('analysisBody');
      if(!body) return;
      body.innerHTML = '';
      var series = {};
      STAGES.forEach(function(s){ series[s] = cumulativeArrays(s); });

      for(var d=0; d<DAYS; d++){
        var tr = document.createElement('tr');
        var tdDay = document.createElement('td');
        tdDay.className = 'day-cell';
        tdDay.textContent = 'D+' + (d+1);
        tr.appendChild(tdDay);

        STAGES.forEach(function(s){
          var exp = series[s].exp[d];
          var act = series[s].act[d];
          var diff = act - exp;
          var tdE = document.createElement('td'); tdE.textContent = fmt(exp);
          var tdA = document.createElement('td'); tdA.textContent = act + '개';
          var tdD = document.createElement('td');
          tdD.textContent = (diff>=0?'+':'') + fmt(diff);
          tdD.className = diff>=0 ? 'diff-pos' : 'diff-neg';
          tr.appendChild(tdE); tr.appendChild(tdA); tr.appendChild(tdD);
        });
        body.appendChild(tr);
      }

      renderTotals(series);
      renderChart(series);
    }

    function renderTotals(series){
      var grid = document.getElementById('totalsGrid');
      if(!grid) return;
      grid.innerHTML = '';
      var grandExp = 0, grandAct = 0;

      STAGES.forEach(function(s){
        var exp = series[s].exp[DAYS-1];
        var act = series[s].act[DAYS-1];
        grandExp += exp; grandAct += act;

        var card = document.createElement('div');
        card.className = 'total-card';
        card.innerHTML =
          '<div class="t-label">' + s + '단계 · 30일 누적</div>' +
          '<div class="t-value expected" style="color:var(--gold)">' + fmt(exp) + '</div>' +
          '<div class="t-sub">기댓값 (개)</div>' +
          '<div class="t-value actual" style="color:var(--cyan);margin-top:10px;">' + act + '</div>' +
          '<div class="t-sub">실제 획득 (개) · 차이 ' + (act-exp>=0?'+':'') + fmt(act-exp) + '</div>';
        grid.appendChild(card);
      });

      var grand = document.createElement('div');
      grand.className = 'total-card grand';
      grand.innerHTML =
        '<div class="t-label">전체 3개 단계 합산</div>' +
        '<div class="t-value expected">' + fmt(grandExp) + '</div>' +
        '<div class="t-sub">기댓값 합계 (개)</div>' +
        '<div class="t-value actual" style="margin-top:10px;">' + grandAct + '</div>' +
        '<div class="t-sub">실제 합계 (개) · 차이 ' + (grandAct-grandExp>=0?'+':'') + fmt(grandAct-grandExp) + '</div>';
      grid.appendChild(grand);
    }

    function renderChart(series){
      if (typeof Chart === 'undefined') return;
      var canvas = document.getElementById('cumChart');
      if(!canvas) return;
      var ctx = canvas.getContext('2d');
      var labels = [];
      for(var d=1; d<=DAYS; d++) labels.push('D+'+d);

      var colors = {7:'#37c7f0', 8:'#f0b429', 9:'#e0679a'};
      var datasets = [];
      STAGES.forEach(function(s){
        datasets.push({ label: s+'단계 기대', data: series[s].exp, borderColor: colors[s], borderDash: [5,4], borderWidth: 1.5, pointRadius: 0 });
        datasets.push({ label: s+'단계 실제', data: series[s].act, borderColor: colors[s], borderWidth: 2.5, pointRadius: 0 });
      });

      if(chartInstance){ chartInstance.destroy(); }
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: datasets },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // ---------- Firebase 데이터 저장 및 실시간 불러오기 ----------
    var saveTimer = null;
    function setStatus(text){
      var el = document.getElementById('saveStatus');
      if(el) el.textContent = text;
    }

    function scheduleSave(){
      setStatus('서버 저장 중…');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function(){
        dbRef.set(data)
          .then(function(){
            var t = new Date();
            setStatus('연동됨 · ' + t.getHours() + ':' + String(t.getMinutes()).padStart(2,'0'));
          })
          .catch(function(err){
            setStatus('저장 실패');
          });
      }, 450);
    }

    function listenData(){
      setStatus('서버 연동 중…');
      dbRef.on('value', function(snapshot){
        var val = snapshot.val();
        if(val){
          STAGES.forEach(function(s){
            if(val[s] && val[s].length === DAYS){ data[s] = val[s]; }
          });
          setStatus('서버 불러오기 완료');
        } else {
          setStatus('신규 기록 시작');
        }
        renderInputGrid();
        renderAnalysis();
      });
    }

    var resetBtn = document.getElementById('resetBtn');
    if(resetBtn){
      resetBtn.addEventListener('click', function(){
        var ok = confirm(activeStage + '단계 기록을 초기화하시겠습니까?');
        if(!ok) return;
        for(var i=0;i<DAYS;i++) data[activeStage][i] = [null,null,null];
        renderInputGrid();
        renderAnalysis();
        scheduleSave();
      });
    }

    // 실행
    renderProbGrid();
    renderSuckerMeter();
    renderTabs();
    listenData();

  })();
  </script>
</body>
</html>
